# Legacy brand canonicalization, 2026-11-25. Certificate is renewed by certbot.
# Only www points to this server; the apex domain is not changed here.
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.datahouseful.com;
    ssl_certificate /etc/letsencrypt/live/www.datahouseful.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.datahouseful.com/privkey.pem;
    root /www/wwwroot/www.datahouseful.com;

    location ^~ /.well-known/acme-challenge/ { try_files $uri =404; }
    location = /index.html { return 301 https://www.wenshucha.com/; }
    location = /wap/index.html { return 301 https://www.wenshucha.com/; }
    location = /product.html { return 301 https://www.wenshucha.com/data/; }
    location = /wap/product.html { return 301 https://www.wenshucha.com/data/; }
    location = /pulit01.html { return 301 https://www.wenshucha.com/data/; }
    location = /aboutus.html { return 301 https://www.wenshucha.com/about/; }
    location = /contact.html { return 301 https://www.wenshucha.com/pricing/#business-wechat; }
    location = /service.html { return 301 https://www.wenshucha.com/buyers-guide/; }
    location ~ ^/(?:wap/)?pulit0[234]\.html$ { return 410; }
    location / { return 301 https://www.wenshucha.com$request_uri; }

    access_log /www/wwwlogs/www.datahouseful.com.log;
    error_log /www/wwwlogs/www.datahouseful.com.error.log;
}
