# 文书查宝塔站点 rewrite 源文件（由 deploy-to-server.sh 自动校验并同步）
if ($host = wenshucha.com) { return 301 https://www.wenshucha.com$request_uri; }

# 唯一首页:只匹配客户端原始 URI；不能用 location = /index.html，
# 否则 nginx 对 / 的内部 index 重写也会命中并形成首页循环。
if ($request_uri = /index.html) { return 301 https://www.wenshucha.com/; }

# 老站遗留页:把既有抓取注意力并到现行页面,同时消掉薄重复页。
location = /portfolio.html { return 301 https://www.wenshucha.com/case-search/; }
location = /server1.html   { return 301 https://www.wenshucha.com/data/; }
location = /server2.html   { return 301 https://www.wenshucha.com/data/; }
location = /server3.html   { return 301 https://www.wenshucha.com/data/; }
location = /contact.html   { return 301 https://www.wenshucha.com/; }

# 旧站运维脚本、设计源文件和部署工具永不进入公开站点。
location ^~ /_wscdl/ { return 410; }
location ^~ /files/  { return 410; }
location ^~ /ops/    { return 404; }
location = /deploy-to-server.sh { return 404; }
location = /gen_llms.py         { return 404; }
location = /linkcheck.py        { return 404; }
