<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e1b2e"/>
      <stop offset="100%" stop-color="#16294a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c8a35a"/>
      <stop offset="100%" stop-color="#e0c178"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#c8a35a" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#c8a35a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- brand mark -->
  <rect x="80" y="80" width="60" height="60" rx="12" fill="url(#accent)"/>
  <text x="110" y="128" font-family="'Songti SC','SimSun',Georgia,serif" font-size="36"
        font-weight="700" fill="#0e1b2e" text-anchor="middle">文</text>
  <text x="170" y="125" font-family="'Songti SC','SimSun',Georgia,serif" font-size="32"
        font-weight="700" fill="#ffffff">文书查</text>

  <!-- eyebrow -->
  <text x="80" y="225" font-family="'Songti SC','SimSun',Georgia,serif" font-size="22"
        fill="#e0c178" letter-spacing="4">全国全量裁判文书数据服务</text>

  <!-- headline -->
  <text x="80" y="320" font-family="'Songti SC','SimSun',Georgia,serif" font-size="68"
        font-weight="700" fill="#ffffff">超过 <tspan fill="url(#accent)">1.5 亿篇</tspan>裁判文书</text>
  <text x="80" y="400" font-family="'Songti SC','SimSun',Georgia,serif" font-size="56"
        font-weight="700" fill="#ffffff">API + MCP · 律师工作台</text>

  <!-- stats row -->
  <text x="80" y="500" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="26"
        fill="rgba(255,255,255,0.78)">覆盖 1985-至今 · 五大类全量 · 字段结构化 · 每日同步</text>

  <!-- footer -->
  <text x="80" y="565" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="20"
        fill="#c8a35a">wenshucha.com  ·  深圳星谱网络科技有限公司</text>
</svg>
